# Background jobs component: switches on the `# component: jobs` rows that dsh-web-app
# (and, for shared base rows, its placeholder patches) keeps disabled, and marks
# `jobs` enabled for the `component: jobs` gates of the agent presets.
# Deselecting the bundle restores the placeholders.

- id: jobs
  disabled: false

- id: job-controller
  disabled: false

- id: ui-jobs
  disabled: false

- insert:
    - id: component-jobs
      name: '@deepseek-ai/dsh-agent-preset-registry/component'
      config:
        id: jobs
