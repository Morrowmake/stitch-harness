# Search tools component: switches on the `# component: search-tools` rows that dsh-web-app
# (and, for shared base rows, its placeholder patches) keeps disabled, and marks
# `search-tools` enabled for the `component: search-tools` gates of the agent presets.
# Deselecting the bundle restores the placeholders.

- insert:
    - id: component-search-tools
      name: '@deepseek-ai/dsh-agent-preset-registry/component'
      config:
        id: search-tools
