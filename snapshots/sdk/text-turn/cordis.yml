# TypeScript SDK snapshot-record patch over `stitch --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.STITCH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- insert:
    - id: snapshot-message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      disabled: !!js "process.env.STITCH_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.STITCH_SNAPSHOT_FEEDBACK !== '1'"
