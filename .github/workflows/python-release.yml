name: Release (Python)

# Build-only: a manual run builds and validates the complete wheel set on
# GitHub-hosted runners and retains it as the python-release-<version>
# artifact. Stitch does not publish to PyPI, so this workflow has no
# registry credentials, OIDC permission, or publication job.
# Manual run: Actions → "Release (Python)" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build six wheels
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64,node24-linux-arm64,node24-macos-arm64,node24-macos-x64,node24-win-x64
      release: true

  python-compat:
    name: Python ${{ matrix.python }} / installed SDK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: stitch_harness*
          path: dist
          merge-multiple: true

      - name: Resolve installed wheel version
        id: compatibility-version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import runpy

          release = runpy.run_path("scripts/build-python-release.py")
          repository_version = release["repository_version"]()
          print(f"version={release['pep440_version'](repository_version)}")
          PY

      - name: Install local release wheels and run the public entry path
        env:
          VERSION: ${{ steps.compatibility-version.outputs.version }}
        run: |
          python -m pip install \
            "dist/stitch_harness-$VERSION-py3-none-any.whl" \
            "dist/stitch_harness_runtime_bin-$VERSION-py3-none-manylinux_2_28_x86_64.whl"
          python scripts/smoke-python-runtime.py --scenario sdk-default
          python scripts/smoke-python-runtime.py --scenario sdk-mcp

  validate:
    name: Validate release candidate
    needs: [build, python-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'

      - name: Resolve release version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import runpy

          release = runpy.run_path("scripts/build-python-release.py")
          repository_version = release["repository_version"]()
          wheel_version = release["pep440_version"](repository_version)
          print(f"repository-version={repository_version}")
          print(f"version={wheel_version}")
          PY

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: stitch_harness*
          path: dist
          merge-multiple: true

      - name: Check release contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            "stitch_harness_runtime_bin-$VERSION-py3-none-macosx_14_0_arm64.whl" \
            "stitch_harness_runtime_bin-$VERSION-py3-none-macosx_14_0_x86_64.whl" \
            "stitch_harness_runtime_bin-$VERSION-py3-none-manylinux_2_28_aarch64.whl" \
            "stitch_harness_runtime_bin-$VERSION-py3-none-manylinux_2_28_x86_64.whl" \
            "stitch_harness_runtime_bin-$VERSION-py3-none-win_amd64.whl" \
            "stitch_harness-$VERSION-py3-none-any.whl" > "$expected"
          find dist -maxdepth 1 -type f -name '*.whl' -exec basename {} \; | sort > "$actual"
          diff -u "$expected" "$actual"
          while IFS= read -r wheel; do
            size="$(stat -c '%s' "dist/$wheel")"
            [ "$size" -lt 100000000 ] || {
              echo "::error::$wheel is $size bytes; public PyPI accepts at most 100000000 bytes by default."
              exit 1
            }
          done < "$actual"

      - name: Validate package metadata
        run: |
          python -m pip install twine==6.2.0
          python -m twine check dist/*.whl

      - name: Record artifact hashes
        run: |
          cd dist
          sha256sum -- *.whl | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
