# Pack the vendored framework sequence: the nine rescoped Cordis packages under
# vendor/, each on its own version line.
#
# Pack runs without credentials on every pull request and master push. Stitch
# does not publish these packages to npm.
name: Release (vendor)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pack runs per ref so concurrent pull requests never displace each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm run release:verify --family vendor

      # The vendored packages publish their own sources and build outputs; the
      # host build produces what their manifests select.
      - name: Build
        run: ${{ github.event_name == 'pull_request' && 'pnpm exec tsx scripts/compile-referenced-projects.ts host-libraries' || 'pnpm run build:lib:host' }}

      # Concurrency here is rehearsal-only: the credentialed publish workflows
      # invoke release:pack without the flag and keep the strictly serial path.
      - name: Pack release tarballs
        run: pnpm run release:pack --family vendor --out dist/npm-vendor --concurrency 8

      - name: Verify packed install
        run: pnpm run release:verify-packed-install --family vendor --from dist/npm-vendor

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vendor-npm-tarballs
          path: dist/npm-vendor/*
          if-no-files-found: error
          retention-days: 7
