name: CI Python

# Python lanes run in their own workflow so a slow runtime build does not keep
# the CI run in progress. They run only when a pull request touches the Python
# SDK, its runtime, or their build scripts, so "python checks passed" is not a
# required branch-protection check.
on:
  pull_request:
    paths:
      - 'python/**'
      - 'packages/sdk/**'
      - 'scripts/*python*'
      - 'scripts/build-exe-for-python-sdk*'
      - 'scripts/snapshots/python-sdk-single-exe/**'
      - '.github/workflows/ci-python.yml'
      - '.github/workflows/build-exe-for-python-sdk.yml'
permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

# Cancel a superseded pull-request run on a new push, as in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sdk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: python 3.10 / keyless SDK
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest

  # The reusable builder owns each published executable, wheel, clean-install,
  # keyless black-box, and trusted real-API path. Linux and Windows x64 block
  # pull requests; python-release.yml builds the complete target matrix.
  python-runtime:
    if: github.event_name == 'pull_request'
    needs: python-sdk
    name: python runtime / release-shaped matrix
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64,node24-win-x64
      ci: true
    secrets:
      DEEPSEEK_API_KEY_EXTERNAL: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}

  # Stable required check for the Python lanes, with the same semantics as
  # ci.yml's "all checks passed": every blocking job in THIS workflow is
  # listed in `needs`.
  python-checks-passed:
    name: python checks passed
    runs-on: ubuntu-latest
    needs: [python-sdk, python-runtime]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: Python checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
