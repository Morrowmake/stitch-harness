name: Desktop release (unsigned)

# Builds unsigned Stitch Desktop installers with the official client profile on
# GitHub-hosted runners. A pushed `stitch-v<version>` tag publishes them to a
# GitHub prerelease; a manual dry run only uploads workflow artifacts.

on:
  push:
    tags: ['stitch-v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and upload workflow artifacts only; never create or update a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  # A tag run owns its release; never cancel it halfway through uploading.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Resolve version and release mode
        id: plan
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          publish=false
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "stitch-v$version" ]; then
              echo "::error::tag $REF_NAME does not match stitch-v$version from package.json"
              exit 1
            fi
            [ "$DRY_RUN" = true ] || publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Stitch $version; publish GitHub Release: $publish"

  package:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Computer Use helper's Package.swift needs Swift 6 (Xcode 16), the
          # default toolchain on the macOS 15 images.
          - target: mac-arm64
            runner: macos-15
            script: package:desktop:mac:arm64:unsigned
            timeout: 150
          - target: mac-x64
            runner: macos-15-intel
            script: package:desktop:mac:x64:unsigned
            timeout: 150
          - target: win-x64
            runner: windows-2025
            script: package:desktop:win:x64:unsigned
            timeout: 120
    defaults:
      run:
        shell: bash
    env:
      ARTIFACTS: apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts
    steps:
      - name: Enable Windows Developer Mode (symlink support) and long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          git config --system core.longpaths true
          # A short cache root keeps the runtime's deep node_modules paths below MAX_PATH.
          New-Item -ItemType Directory -Force -Path 'C:\stitch-cache' | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'STITCH_DESKTOP_PACKAGE_CACHE_DIR=C:\stitch-cache' -Encoding utf8

      # Full history: the build records the packaged commit and its dirty state.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # The Windows Computer Use helper is a self-contained .NET 10 publish.
      - uses: actions/setup-dotnet@v5.4.0
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'

      - name: Install (immutable)
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1

      # Unsigned Windows builds still read .env.windows; macOS unsigned builds use fixed defaults.
      - name: Write Windows packaging settings
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Content -Path apps/desktop/.env.windows -Value 'STITCH_DESKTOP_APP_ID=io.github.morrowmake.stitch' -Encoding utf8NoBOM

      - name: Check configuration and toolchain
        run: pnpm run ${{ matrix.script }} --official --check

      - name: Package
        run: pnpm run ${{ matrix.script }} --official

      - name: List installers
        run: ls -la "$ARTIFACTS"

      # The ZIP is the in-app update payload: it must extract to a bundle whose framework links and ad-hoc
      # signatures, including the nested Computer Use helper's, still verify.
      - name: Verify the macOS update ZIP
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          check=$(mktemp -d)
          ditto -x -k "$ARTIFACTS"/stitch-*-unsigned.zip "$check"
          app="$check/Stitch.app"
          test -L "$app/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          codesign --verify --strict --verbose=2 "$app"
          helper=$(find "$app/Contents/Resources/app.asar.unpacked" -type d -name 'Stitch Computer Use.app' -print -quit)
          test -n "$helper"
          codesign --verify --strict --verbose=2 "$helper"
          codesign -dv "$helper" 2>&1 | grep -E '^(Identifier|Signature)='

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACTS }}/stitch-${{ needs.plan.outputs.version }}-*-unsigned.dmg
            ${{ env.ARTIFACTS }}/stitch-${{ needs.plan.outputs.version }}-*-unsigned.zip
            ${{ env.ARTIFACTS }}/stitch-${{ needs.plan.outputs.version }}-*-unsigned.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: packaging-runs-${{ matrix.target }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Runs on dry runs too, so manifest generation is exercised before a tag needs it. Without the
  # STITCH_RELEASE_SIGNING_KEY secret it writes an unsigned latest.json that the in-app updater rejects.
  manifest:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/package.json
            apps/desktop/src/update-manifest.ts
            apps/desktop/scripts/sign-update-assets.ts
            apps/desktop/scripts/generate-update-signing-key.ts
          sparse-checkout-cone-mode: false

      # Plain Node type stripping runs the signer; no dependency install is needed.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Write latest.json and checksums
        env:
          STITCH_RELEASE_SIGNING_KEY: ${{ secrets.STITCH_RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/sign-update-assets.ts --dir dist --version "$VERSION" --tag "stitch-v$VERSION"
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt latest.json

      # The installers stay in their desktop-<target> artifacts; this adds only the files derived from them.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-manifest
          path: |
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [plan, manifest]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-manifest
          path: dist

      # GitHub's releases/latest ignores prereleases; the updater lists releases and reads each one's latest.json.
      - name: Create or update the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "Stitch $VERSION" --generate-notes -- *
          fi
