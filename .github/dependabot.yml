version: 2

# Security updates only: `open-pull-requests-limit: 0` disables routine version-update
# pull requests, while Dependabot security updates (enabled in the repository settings)
# still open pull requests for dependencies with known vulnerabilities.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
